name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build main.cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compiler version
        run: g++ --version

      - name: build (submission mode)
        run: g++ -std=c++20 -O2 -Wall -Wextra -Werror -o /tmp/main main.cpp

      - name: build with sanitizers
        run: g++ -std=c++20 -g -Wall -Wextra -Werror -fsanitize=address,undefined -o /tmp/main_sanitized main.cpp

      - name: smoke run
        run: printf '0\n' | /tmp/main

  benchmarks:
    name: build benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build every benchmark
        run: |
          shopt -s nullglob
          sources=(benchmarks/*/*.cpp)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "no benchmarks yet"
            exit 0
          fi
          scripts/extract_library.sh benchmarks/generated/algo_library.hpp
          for source in "${sources[@]}"; do
            echo "::group::$source"
            g++ -std=c++20 -O2 -Wall -Wextra -Werror -I benchmarks/generated \
              -o "/tmp/$(basename "$source" .cpp)" "$source"
            echo "::endgroup::"
          done

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: check formatting
        run: scripts/format.sh --check

  style:
    name: style rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Library code must not use built-in integer types. The competitive template around
      # it is exempt, so only the body of `namespace algo` is scanned.
      - name: no built-in integer types in library code
        run: |
          shopt -s nullglob
          sources=(benchmarks/*/*.cpp)
          sed -n '/^namespace algo {$/,/^}  \/\/ namespace algo$/p' main.cpp > /tmp/library_region.cpp
          if [ ! -s /tmp/library_region.cpp ]; then
            echo "::error::could not locate the 'namespace algo' block in main.cpp"
            exit 1
          fi
          # `int main()` is the one signature the language forces on us, so benchmarks may
          # spell it. Nothing else is exempt.
          violations=$(grep -nE '(^|[^_[:alnum:]])(long long|unsigned|short|\bint\b)([^_[:alnum:]]|$)' \
            /tmp/library_region.cpp "${sources[@]}" | grep -v 'int main() {$' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::built-in integer types are banned; use std::int64_t / std::int32_t / std::size_t / std::uint64_t"
            exit 1
          fi
          echo "ok"
