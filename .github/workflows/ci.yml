name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build main.cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compiler version
        run: g++ --version

      - name: build (submission mode)
        run: g++ -std=c++20 -O2 -Wall -Wextra -Werror -o /tmp/main main.cpp

      - name: build with sanitizers
        run: g++ -std=c++20 -g -Wall -Wextra -Werror -fsanitize=address,undefined -o /tmp/main_sanitized main.cpp

      - name: smoke run
        run: printf '0\n' | /tmp/main

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Benchmarks are timing gates, not reports, so running the untouched ones would only
      # burn minutes and invite flaky reds. A change to main.cpp affects every structure and
      # therefore runs everything; a change to one benchmark runs only that one.
      - name: decide what to run
        id: select
        run: |
          set -euo pipefail
          shopt -s nullglob
          all=(benchmarks/*/*.cpp)
          if [ ${#all[@]} -eq 0 ]; then
            echo "selected=" >> "$GITHUB_OUTPUT"
            echo "no benchmarks yet"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit, running every benchmark"
            printf 'selected=%s\n' "${all[*]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -qE '^(main\.cpp|scripts/extract_library\.sh|\.github/workflows/ci\.yml)$'; then
            echo "the library or the harness moved, running every benchmark"
            printf 'selected=%s\n' "${all[*]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected=$(echo "$changed" | grep -E '^benchmarks/.*\.cpp$' || true)
          printf 'selected=%s\n' "$(echo $selected)" >> "$GITHUB_OUTPUT"

      - name: run the selected benchmarks
        if: steps.select.outputs.selected != ''
        run: |
          set -euo pipefail
          scripts/extract_library.sh benchmarks/generated/algo_library.hpp
          for source in ${{ steps.select.outputs.selected }}; do
            echo "::group::$source"
            g++ -std=c++20 -O2 -Wall -Wextra -Werror -I benchmarks/generated \
              -o "/tmp/$(basename "$source" .cpp)" "$source"
            "/tmp/$(basename "$source" .cpp)"
            echo "::endgroup::"
          done

      - name: nothing to run
        if: steps.select.outputs.selected == ''
        run: echo "no benchmark and no library change in this diff"

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run every test under sanitizers
        run: scripts/run_tests.sh

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: check formatting
        run: scripts/format.sh --check

  style:
    name: style rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Library code must not use built-in integer types. The competitive template around
      # it is exempt, so only the body of `namespace algo` is scanned.
      - name: no built-in integer types in library code
        run: |
          shopt -s nullglob
          sources=(benchmarks/*/*.cpp tests/*/*.cpp tests/*.hpp)
          sed -n '/^namespace algo {$/,/^}  \/\/ namespace algo$/p' main.cpp > /tmp/library_region.cpp
          if [ ! -s /tmp/library_region.cpp ]; then
            echo "::error::could not locate the 'namespace algo' block in main.cpp"
            exit 1
          fi
          # `int main()` is the one signature the language forces on us, so benchmarks may
          # spell it. Nothing else is exempt.
          violations=$(grep -nE '(^|[^_[:alnum:]])(long long|unsigned|short|\bint\b)([^_[:alnum:]]|$)' \
            /tmp/library_region.cpp "${sources[@]}" | grep -v 'int main() {$' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::built-in integer types are banned; use std::int64_t / std::int32_t / std::size_t / std::uint64_t"
            exit 1
          fi
          echo "ok"
